project:
  type: website

  render:
    - "*.qmd"
    - "blog/**/*.qmd"
    - "projects/**/*.qmd"
    - "!research/**"

  resources:
    - robots.txt
    - images/
    - "!images/avatar/"
    - assets/
    - photos/
    - data/

lang: en

filters:
  - _includes/canonical.lua

execute:
  freeze: auto

website:
  title: "Garry Sykes"
  description: "Photography portfolio and blog of Garry Sykes."
  site-url: https://garrysykes.com
  favicon: images/favicon.ico

  navbar:
    left:
      - text: Gallery
        href: index.qmd

      - text: Projects
        href: projects/index.qmd

      - text: Blog
        href: blog/index.qmd

      - text: About
        href: about.qmd

    right:
      # - icon: github
      #   aria-label: GitHub
      #   href: https://github.com/garrysykes
      - icon: instagram
        aria-label: Instagram
        href: https://www.instagram.com/garrysykes.photo
      - icon: facebook
        aria-label: Facebook
        href: https://www.facebook.com/profile.php?id=61588969539539

  page-footer:
    center: "© 2026 Garry Sykes. All rights reserved."

  # TODO: default share image (1200x630 JPEG) -> open-graph: {image: images/share.jpg}
  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      - cosmo
      - styles.scss

    code-overflow: wrap

    date-format: medium

    include-in-header:
      - _includes/head.html

    include-before-body:
      - _includes/skip-link.html

    include-after-body:
      - _includes/reorder-title-meta.html
      - _includes/external-links.html
      - _includes/a11y.html
