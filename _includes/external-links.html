<script>
  window.addEventListener("DOMContentLoaded", function () {
    // Links to other sites (navbar icons, About buttons, post links) open in a new tab.
    document.querySelectorAll('a[href^="http"]').forEach(function (a) {
      if (a.host !== location.host) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
    });
  });

  // Deter casual image saving: no right-click menu or drag on photos
  // (gallery, PhotoSwipe, blog lightbox and in-page images).
  ["contextmenu", "dragstart"].forEach(function (type) {
    document.addEventListener(type, function (e) {
      if (e.target.closest && e.target.closest("img, .pg-item, .pswp__img, .gslide-image")) {
        e.preventDefault();
      }
    });
  });
</script>
