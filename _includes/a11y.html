<script>
// Accessibility patches for markup Quarto generates: label the search widget,
// drop the navbar toggler's invalid role="menu", hide the empty duplicate links
// in blog listings from screen readers/tab order, mark listing cover images as
// decorative (the title sits beside them) and expose listing titles as level-2
// headings (Quarto uses h3/h5 straight after the page h1). Search is built after load.
(() => {
  const patch = () => {
    document.querySelectorAll(".aa-DetachedSearchButton, .aa-Autocomplete")
      .forEach((el) => el.hasAttribute("aria-label") || el.setAttribute("aria-label", "Search"));
    document.querySelector(".navbar-toggler[role='menu']")?.removeAttribute("role");
    document.querySelectorAll(".quarto-post a").forEach((a) => {
      if (!a.textContent.trim() && !a.querySelector("img")) {
        a.setAttribute("aria-hidden", "true");
        a.tabIndex = -1;
      }
    });
    document.querySelectorAll(".quarto-listing img:not([alt])").forEach((img) => (img.alt = ""));
    document.querySelectorAll(".quarto-listing .listing-title").forEach((h) => h.setAttribute("aria-level", "2"));
  };
  // Quarto marks a nav item active only on its exact page; also mark it on
  // pages inside its section (blog posts, project pages). Gallery (site root) excluded.
  const markSection = () => {
    const root = new URL(document.querySelector(".navbar-brand")?.href || "/", location.href).pathname.replace(/index\.html$/, "");
    document.querySelectorAll(".navbar-nav .nav-link[href]").forEach((a) => {
      const url = new URL(a.href, location.href);
      if (url.origin !== location.origin) return;
      const dir = url.pathname.replace(/index\.html$/, "");
      if (dir !== root && dir.endsWith("/") && location.pathname.startsWith(dir)) {
        a.classList.add("active");
        a.setAttribute("aria-current", "page");
      }
    });
  };
  document.addEventListener("DOMContentLoaded", markSection);
  const search = document.getElementById("quarto-search");
  if (search) new MutationObserver(patch).observe(search, { childList: true, subtree: true });
  document.addEventListener("DOMContentLoaded", patch);
})();
</script>
